# Tag this repository (v1.0.0) and every map lands on the release as its own pack zip,
# which website-city publishes as gamemann/<map id>@<version>. The game imports the
# maps, so dot-ci checks game-g2gfast out beside them; see dot-ci's release-maps.yml.
name: Release

on:
    push:
        tags: ['v*']
    workflow_dispatch:

jobs:
    release:
        uses: modcommunity/dot-ci/.github/workflows/release-maps.yml@v1.2.5
        with:
            game: gamemann/game-g2gfast
        secrets:
            DEPS_TOKEN: ${{ secrets.DOT_DEPS_TOKEN }}
